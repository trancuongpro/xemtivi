<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giải Trí Trực Tuyến - Cải Lương</title>
    <link rel="stylesheet" href="stylescl.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Giải Trí Trực Tuyến</h1>
            <div class="button-group">
                <button id="htv-btn">HTV</button>
                <button id="vtv-btn">VTV</button>
                <button id="thvl-btn">THVL</button>
                <button id="tiviplus-btn">Tivi Plus</button>
                <button id="phim-btn">Xem Phim</button>
                <button id="cayphim-btn">Luyện Phim</button>
                <button id="sieuphim-btn">Siêu Phim</button>
                <button id="fm-btn">Radio</button>
                <button id="cailuong-btn">Cải Lương</button>
                <button id="reload-btn">Tải Lại</button>
            </div>
        </header>
        <div class="content">
            <div class="video-lists-container">
                <div class="playlist-wrapper">
                    <div class="video-list-section">
                        <h2>Tuồng Cổ</h2>
                        <div id="video-list-tuongco">
                            <iframe id="tuongco-iframe" width="100%" height="315" src="https://www.youtube.com/embed/videoseries?si=5Fr8AeOitwBaYJNN&list=PLOcT2MYIWAHVJEVdVryjxpyoyqnWaSVrO&autoplay=1" title="YouTube Playlist Tuồng Cổ" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                            <p class="note">Lưu ý: Danh sách phát hiển thị tối đa 200 video. Nhấp "Next" trong video để xem thêm.</p>
                            <div id="tuongco-video-list" class="video-list"></div>
                        </div>
                    </div>
                    <div class="video-list-section">
                        <h2>Tân Cổ Giao Duyên</h2>
                        <div id="video-list-tancogiaouyen">
                            <iframe id="tancogiaouyen-iframe" width="100%" height="315" src="https://www.youtube.com/embed/videoseries?si=-9yNFR937j0VGPnO&list=PLM9ECb-HO7rfbqORClR_dsV0E3ZE1Ce68" title="YouTube Playlist Tân Cổ Giao Duyên" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                            <p class="note">Lưu ý: Danh sách phát hiển thị tối đa 200 video. Nhấp "Next" trong video để xem thêm.</p>
                            <div id="tancogiaouyen-video-list" class="video-list"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div id="video-popup" class="video-popup">
            <div class="video-popup-content">
                <button id="close-popup" class="close-popup"><i class="fas fa-times"></i></button>
                <iframe id="popup-iframe" width="100%" height="315" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
        </div>
        <footer>
            <p>Thiết Kế : Trần Cường ... 2025</p>
        </footer>
    </div>
    	<script defer src="script.js"></script>
</body>
</html>
