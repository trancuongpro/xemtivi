<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giải Trí Trực Tuyến</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Giải Trí Trực Tuyến</h1>
            <div class="button-group">
                <button id="htv-btn">HTV</button>
                <button id="vtv-btn">VTV</button>
                <button id="thvl-btn">THVL</button>
				<button id="tiviplus-btn">Tivi Plus</button>
				<button id="phim-btn">Xem Phim</button>
				<button id="cayphim-btn">Luyện Phim</button>
				<button id="sieuphim-btn">Siêu Phim</button>
				<button id="fm-btn">Radio</button>
				<button id="cailuong-btn">Cải Lương</button>
                <button id="reload-btn">Tải Lại</button>
            </div>
        </header>
        <div class="viewer">
            <iframe id="htv-frame" src="https://vovmedia.vn/" allowfullscreen></iframe>
        </div>
        <footer>
            <p>Thiết Kế: Trần Cường ... 2025 | Giờ Việt Nam: <span id="vietnam-time"></span> | <span id="vietnam-date"></span></p>
        </footer>
    </div>
    <script src="script.js"></script>
	<script>
	// Hiển thị thời gian và ngày dương lịch theo múi giờ Việt Nam
        function updateVietnamTime() {
            const date = new Date();
            const optionsTime = {
                timeZone: 'Asia/Ho_Chi_Minh',
                hour12: false,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            };
            const optionsDate = {
                timeZone: 'Asia/Ho_Chi_Minh',
                weekday: 'long',
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
            };
            const time = date.toLocaleTimeString('vi-VN', optionsTime);
            const dateParts = date.toLocaleDateString('vi-VN', optionsDate).split(', ');
            const weekday = dateParts[0]; // Lấy thứ, ví dụ: "Thứ Tư"
            const dateStr = dateParts[1].split('/').join('/'); // Lấy ngày/tháng/năm, ví dụ: "17/04/2025"
            document.getElementById('vietnam-time').textContent = time;
            document.getElementById('vietnam-date').textContent = `${weekday} ${dateStr}`;
        }

        // Cập nhật thời gian mỗi giây
        updateVietnamTime();
        setInterval(updateVietnamTime, 1000);
    </script>
